name: Maven CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-unit-test:
    name: Compile and Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      - name: Compile project
        run: mvn --batch-mode --no-transfer-progress -DskipTests test-compile

      - name: Run WaitUtilsTest
        run: mvn --batch-mode --no-transfer-progress -Dtest=WaitUtilsTest test
